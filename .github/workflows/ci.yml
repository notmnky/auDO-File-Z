name: "CI"

# Runs the checks on every push and pull request, on the platforms the app ships for.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"   # Apple Silicon runner; also type-checks Intel below
            rust-targets: "x86_64-apple-darwin"
          - platform: "windows-latest"
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Check version files agree
        run: node scripts/check-versions.js

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend (tsc && vite build)
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Check the Intel macOS build compiles
        if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: cargo check --target x86_64-apple-darwin
