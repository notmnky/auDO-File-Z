name: "Release Publish"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal DMG runs natively on both Apple Silicon and Intel Macs.
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # The app compares its version.json with the release tag to offer updates,
      # so a tag that does not match the version files must never be published.
      - name: Check that the tag matches the app version
        run: node scripts/check-versions.js "${{ github.ref_name }}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "auDO FileZ ${{ github.ref_name }}"
          releaseBody: "Cryptographic duplicate-file finder for macOS (Apple Silicon and Intel, one universal download) and Windows (64-bit)."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
